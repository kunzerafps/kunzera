    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Sólo los grosores que el sitio realmente usa: Inter sin el 300 (no
         hay font-light en ningún lado), Orbitron 400/700/900 (los otros no
         se usan). Menos archivos de fuente = menos bloqueo de render. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    // ── IDs propios para mejorar la coincidencia de eventos con Meta ──
    // Corre antes de que cargue el bundle; src/lib/visitorId.ts y
    // src/lib/cookies.ts los leen desde window.* / la cookie.
    (function () {
      try {
        var vid = localStorage.getItem('kz_vid');
        if (!vid) {
          vid = (self.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : ('v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
          localStorage.setItem('kz_vid', vid);
        }
        window.__kunzeraVid = vid;
      } catch (e) { /* modo privado: seguimos sin external_id */ }
      try {
        // _fbc a partir de ?fbclid=... cuando el pixel no la pudo crear
        // (bloqueador de anuncios, Safari). Formato que espera Meta:
        // fb.1.<timestamp>.<fbclid>. max-age = 90 días. Se (re)escribe sólo
        // si no había _fbc o si el fbclid del link es otro — así no le
        // cambiamos el timestamp a Meta en cada navegación de la misma
        // visita, pero sí lo actualizamos si la persona vuelve por otro aviso.
        var m = window.location.search.match(/[?&]fbclid=([^&]+)/);
        if (m) {
          var fbclid = decodeURIComponent(m[1]);
          var existing = (document.cookie.match(/(?:^|;\s*)_fbc=([^;]*)/) || [])[1];
          // El fbclid es todo lo que va DESPUÉS del tercer punto
          // ('fb.1.<timestamp>.<fbclid>') y el propio fbclid puede traer
          // puntos. Mismo criterio que src/lib/deeplink.ts (parts.slice(3)):
          // con split('.').pop() un fbclid con punto nunca coincidía y se
          // reescribía _fbc con hora nueva en cada carga de la misma visita.
          var existingParts = existing ? existing.split('.') : [];
          var existingClid = existingParts.length > 3 ? existingParts.slice(3).join('.') : '';
          if (!existing || existingClid !== fbclid) {
            var fbc = 'fb.1.' + Date.now() + '.' + fbclid;
            document.cookie = '_fbc=' + fbc + ';path=/;max-age=7776000;samesite=lax';
            window.__kunzeraFbc = fbc;
          } else {
            window.__kunzeraFbc = existing;
          }
        }
      } catch (e) { /* noop */ }
      try {
        // _fbp: si el pixel está bloqueado (Safari ITP, bloqueador de
        // anuncios) nunca crea esta cookie y todos los eventos server-side
        // se quedan sin ella — es de las señales que más pesan en el match.
        // La creamos nosotros con el formato que espera Meta
        // (fb.1.<timestamp>.<random de 16 dígitos>) ANTES de fbq('init'):
        // si el pixel sí carga, la toma como propia y navegador + servidor
        // quedan consistentes; si no carga, el servidor igual la manda.
        var existingFbp = (document.cookie.match(/(?:^|;\s*)_fbp=([^;]*)/) || [])[1];
        if (!existingFbp) {
          // Suffix random del mismo estilo que el que genera fbevents.js
          // (~10 dígitos, entero seguro) — no 16 dígitos que Events Manager
          // podría marcar como formato raro.
          var fbp = 'fb.1.' + Date.now() + '.' + Math.floor(Math.random() * 1e10);
          document.cookie = '_fbp=' + fbp + ';path=/;max-age=7776000;samesite=lax';
          window.__kunzeraFbp = fbp;
        } else {
          window.__kunzeraFbp = existingFbp;
        }
      } catch (e) { /* noop */ }
    })();

    // Sesión interna (panel de admin / dispositivo del equipo): NO se
    // inicializa el pixel ni se manda el PageView. Contar esas visitas como
    // tráfico real ensucia los públicos de remarketing y el modelo de
    // optimización de Meta (se termina pagando por mostrarle anuncios al
    // propio equipo). Misma lógica que src/lib/pixel.ts isStaffSession —
    // duplicada acá porque este HTML es estático y no puede importar.
    //   - localStorage 'kz_staff': timestamp del último login al panel (lo
    //     setea src/hooks/useAdminGate.ts); vence a los 90 días.
    //   - sessionStorage 'kz_admin': login al panel en ESTA sesión (respaldo
    //     para cuando localStorage está bloqueado).
    //   - '?kz_track=1' en la URL: escotilla POR ESTA VISITA; deja una marca
    //     en sessionStorage y NO borra 'kz_staff'. Borrarla apagaba la marca
    //     del dispositivo PARA SIEMPRE y un equipo del staff podía quedar
    //     emitiendo eventos como si fuera un cliente sin que nadie lo supiera.
    //   El hash '#admin' SOLO ya no alcanza: no hay contraseña de por medio,
    //   así que un link compartido con ese hash dejaba sin tracking a un
    //   cliente real. Costo asumido: la primera carga del panel en un
    //   dispositivo nuevo, antes de loguearse, cuenta como visita normal.
    var __kzStaff = false;
    try {
      var __KZ_TTL = 7776000000; // 90 días en ms
      var __kzTrack = false;
      if (/[?&]kz_track=1(?:&|$)/.test(window.location.search)) {
        try { sessionStorage.setItem('kz_track', '1'); } catch (e2) {}
        __kzTrack = true;
      } else {
        try { __kzTrack = sessionStorage.getItem('kz_track') === '1'; } catch (e2) {}
      }
      if (!__kzTrack) {
        var __kzRaw = localStorage.getItem('kz_staff');
        if (__kzRaw === '1') {
          __kzStaff = true; // valor viejo pre-timestamp
        } else if (__kzRaw) {
          var __kzTs = Number(__kzRaw);
          __kzStaff = isFinite(__kzTs) && (Date.now() - __kzTs) < __KZ_TTL;
        }
        if (!__kzStaff) {
          try { __kzStaff = sessionStorage.getItem('kz_admin') === '1'; } catch (e2) {}
        }
      }
    } catch (e) { /* localStorage bloqueado: se trata como visitante normal */ }

    if (!__kzStaff) {
      // Este ID también vive server-side en netlify/functions/lib/metaPixelId.ts
      // (configurable por la env var META_PIXEL_ID, con este mismo valor como
      // fallback). Este archivo es HTML estático — no lee esa env var — así que
      // si alguna vez se migra el Pixel a otro dataset, hay que actualizar ACÁ
      // también a mano y mantenerlo igual.
      // Se pasa el id propio del navegador como external_id (advanced
      // matching): así hasta los eventos anónimos (PageView, ViewContent) le
      // dan a Meta una clave para reconocer a la persona, y se reconcilian con
      // la copia server-side, que ya manda este mismo id.
      fbq('init', '761377043609509', window.__kunzeraVid ? { external_id: window.__kunzeraVid } : {});
      // eventID compartido con el envío server-side (ver useServerPageView.ts)
      // para que Meta deduplique el PageView del navegador y el del servidor
      // como un solo evento, en vez de contar la visita dos veces.
      window.__kunzeraPvId = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('pv-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      fbq('track', 'PageView', {}, {eventID: window.__kunzeraPvId});
    }
    </script>
    <!-- End Meta Pixel Code -->
  </head>
