<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8" /><title>Video 02 · Boot Sequence</title>
<link rel="stylesheet" href="_shared.css">
<script src="_timeline.js"></script>
<style>
.terminal{
  font-family:'JetBrains Mono', monospace;
  font-size: 36px; color: var(--red-400);
  line-height: 1.6; white-space: pre;
}
.terminal .line{
  display:block; overflow:hidden; white-space:nowrap;
  width: 0; min-height: 60px;
}
.cursor{ color:#fff;}
.sweep{
  position:absolute; left:0; right:0; height: 80px;
  top: -100px; z-index: 22;
  background: linear-gradient(180deg, transparent, rgba(239,19,19,.8), transparent);
  filter: blur(2px);
  box-shadow: 0 0 80px rgba(239,19,19,.4);
}
.reveal{
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size: 128px; line-height:.95;
  text-transform:uppercase; letter-spacing:.02em;
  text-shadow: 0 4px 24px rgba(0,0,0,.7);
}
</style>
</head><body>
<div class="canvas video">
  <div class="side-lines l"></div><div class="side-lines r"></div>
  <div class="sweep" id="sweep"></div>

  <div class="ig-header">
    <div class="ig-bars">
      <div class="ig-bar" id="bar0"></div><div class="ig-bar"></div><div class="ig-bar"></div><div class="ig-bar"></div><div class="ig-bar"></div>
    </div>
    <div class="ig-user"><div class="avatar"></div><span>ezekunnnn</span><span class="time">· ahora</span></div>
  </div>

  <div class="inner" style="justify-content:center; gap: 60px;">
    <div class="terminal" id="terminal">
<span class="line" id="l1">&gt; kunzera.init</span>
<span class="line" id="l2">&gt; loading tweaks [##########] 100%</span>
<span class="line" id="l3">&gt; system optimized<span class="cursor" id="cursor">_</span></span>
    </div>
    <div class="reveal" id="reveal" style="opacity:0;">
      <span style="color:#fff">EXPRIMÍ CADA</span><br/>
      <span class="text-red">FPS DE TU PC</span>
    </div>
    <div class="cta" id="cta" style="opacity:0;">Reservá turno ›</div>
  </div>
  <div class="footer-note">+6000 PCs · 100% remoto</div>
  <div class="watermark"></div>
  <div class="watermark-corner">drop3d</div>
</div>
<script>
const D = 7.5;
const $ = id => document.getElementById(id);
const texts = { l1: '> kunzera.init', l2: '> loading tweaks [##########] 100%', l3: '> system optimized' };
const l1 = $('l1'), l2 = $('l2'), l3 = $('l3');
const cursor = $('cursor'), reveal = $('reveal'), cta = $('cta');
const sweep = $('sweep'), bar0 = $('bar0');

function typeIn(el, fullText, t, startT, endT) {
  const p = TL.clamp((t - startT) / (endT - startT), 0, 1);
  const chars = Math.floor(fullText.length * p);
  el.style.width = 'auto';
  el.textContent = fullText.slice(0, chars);
  if (el === l3 && chars >= fullText.length) {
    el.innerHTML = fullText + '<span class="cursor">_</span>';
  }
}

__startLoop(D, t => {
  const {seg, clamp, lerp, fadeHold, easeInCubic, easeOutCubic} = TL;

  // IG progress bar
  const fill = clamp(t / D, 0, 1);
  bar0.style.background = `linear-gradient(90deg, #fff ${fill*100}%, rgba(255,255,255,.35) ${fill*100}%)`;

  // Typing
  typeIn(l1, texts.l1, t, 0.3, 1.3);
  typeIn(l2, texts.l2, t, 1.4, 2.8);
  typeIn(l3, texts.l3, t, 2.9, 3.9);
  cursor.style.opacity = (Math.floor(t * 2) % 2 === 0) ? 1 : 0;

  // Sweep from top to bottom around 4s
  const sweepP = clamp((t - 3.8) / 0.7, 0, 1);
  sweep.style.top = lerp(-100, 1920, easeInCubic(sweepP)) + 'px';
  sweep.style.opacity = sweepP > 0 && sweepP < 1 ? 1 : 0;

  // Reveal
  const rOp = fadeHold(t, 4.4, 4.9, D-0.3, D);
  reveal.style.opacity = rOp;
  reveal.style.transform = `scale(${lerp(0.9, 1, rOp)})`;

  // CTA
  const cOp = fadeHold(t, 5.4, 5.9, D-0.3, D);
  cta.style.opacity = cOp;
  cta.style.transform = `translateY(${(1-cOp) * 30}px)`;
  const pulse = 1 + Math.sin((t - 5.9) * 4) * 0.04 * (t > 5.9 ? 1 : 0);
  cta.style.boxShadow = `0 0 ${60 + pulse*40}px rgba(239,19,19,${0.6 + pulse*0.2}), inset 0 0 20px rgba(255,255,255,.15)`;
});
</script>
</body></html>
